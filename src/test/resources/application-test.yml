spring:
  datasource:
    url: jdbc:h2:mem:auth_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

security:
  jwt:
    issuer: ecomm-auth-service-test
    access-token-expiration-minutes: 5
    refresh-token-expiration-days: 1
    rsa:
      key-id: test-key-1

logging:
  level:
    root: WARN
    com.ecomm.auth: DEBUG

